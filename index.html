<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaria</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

       body {
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(rgba(8, 10, 35, 0.35), rgba(8, 10, 35, 0.55)),
        url("lunaria-cover.png") center center / cover no-repeat fixed;

    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .8;
            background-image:
                radial-gradient(circle,white 1px,transparent 1px),
                radial-gradient(circle,white 1px,transparent 1px);
            background-size: 90px 90px,140px 140px;
            background-position: 10px 20px,60px 80px;
        }

        .container {
            position: relative;
            width: min(90%,430px);
            padding: 42px 32px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 28px;
            background: rgba(16,19,50,.82);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 70px rgba(0,0,0,.45);
            text-align: center;
        }

        .moon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 7px;
            text-shadow: 0 0 25px rgba(170,150,255,.8);
        }

        .subtitle {
            color: #bfc4e8;
            margin: 10px 0 30px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }

        .login-btn {
            background: #8f7cff;
            color: white;
        }

        .register-btn {
            background: rgba(255,255,255,.09);
            color: white;
            border: 1px solid rgba(255,255,255,.15);
        }

        .form,
        .world {
            display: none;
            text-align: left;
        }

        h2 {
            text-align: center;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin: 12px 0 7px;
            color: #cbd0f4;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.08);
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #9b8cff;
        }

        .back {
            background: transparent;
            color: #aaaed1;
            font-size: 14px;
        }

        .world {
            text-align: center;
        }

        .world-icon {
            font-size: 70px;
            margin-bottom: 8px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin: 25px 0;
            gap: 10px;
        }

        .stat {
            flex: 1;
            padding: 15px 8px;
            border-radius: 15px;
            background: rgba(255,255,255,.08);
        }

        .stat span {
            display: block;
            font-size: 13px;
            color: #bfc4e8;
            margin-bottom: 5px;
        }

        .small-note {
            margin-top: 20px;
            font-size: 12px;
            color: #888db6;
        }
    </style>
</head>

<body>

<div class="stars"></div>

<main class="container">

    <!-- TRANG CHỦ -->
    <section id="home">

        <div class="moon">🌙</div>

        <div class="logo">LUNARIA</div>

        <p class="subtitle">
            Một thế giới đang chờ bạn khám phá...
        </p>

        <button class="login-btn" onclick="showForm('login')">
            Đăng nhập
        </button>

        <button class="register-btn" onclick="showForm('register')">
            Tạo tài khoản
        </button>

        <p class="small-note">
            Mỗi người chơi — một hành trình riêng.
        </p>

    </section>


    <!-- ĐĂNG NHẬP -->
    <section id="login" class="form">

        <h2>🌙 Chào mừng trở lại</h2>

        <label>Tên đăng nhập</label>
        <input id="loginUsername" type="text" placeholder="Nhập tên đăng nhập">

        <label>Mật khẩu</label>
        <input id="loginPassword" type="password" placeholder="Nhập mật khẩu">

        <button class="login-btn" onclick="login()">
            Vào Lunaria
        </button>

        <button class="back" onclick="showHome()">
            ← Quay lại
        </button>

    </section>


    <!-- ĐĂNG KÝ -->
    <section id="register" class="form">

        <h2>✨ Tạo tài khoản</h2>

        <label>Tên đăng nhập</label>
        <input id="registerUsername" type="text" placeholder="Tên đăng nhập">

        <label>Mật khẩu</label>
        <input id="registerPassword" type="password" placeholder="Mật khẩu">

        <label>Nhập lại mật khẩu</label>
        <input id="registerPassword2" type="password" placeholder="Nhập lại mật khẩu">

        <button class="login-btn" onclick="register()">
            Tạo tài khoản
        </button>

        <button class="back" onclick="showHome()">
            ← Quay lại
        </button>

    </section>


    <!-- THẾ GIỚI -->
    <section id="world" class="world">

        <div class="world-icon">🌌</div>

        <h2>Chào mừng đến Lunaria!</h2>

        <p>
            Xin chào <b id="playerName"></b> 🌙
        </p>

        <div class="stats">

            <div class="stat">
                <span>🪙 Xu</span>
                <b id="coins">100</b>
            </div>

            <div class="stat">
                <span>💎 Kim cương</span>
                <b id="diamonds">10</b>
            </div>

        </div>

        <p>
            Đây là thế giới riêng của bạn.<br>
            Một hành trình mới đang bắt đầu...
        </p>

        <button class="login-btn" onclick="logout()">
            Rời khỏi thế giới
        </button>

    </section>

</main>


<script>

    function hideAll() {
        document.getElementById("home").style.display = "none";
        document.getElementById("login").style.display = "none";
        document.getElementById("register").style.display = "none";
        document.getElementById("world").style.display = "none";
    }


    function showForm(type) {
        hideAll();
        document.getElementById(type).style.display = "block";
    }


    function showHome() {
        hideAll();
        document.getElementById("home").style.display = "block";
    }


    function getUsers() {
        return JSON.parse(localStorage.getItem("lunariaUsers")) || {};
    }


    function saveUsers(users) {
        localStorage.setItem("lunariaUsers", JSON.stringify(users));
    }


    function register() {

        const username =
            document.getElementById("registerUsername").value.trim();

        const password =
            document.getElementById("registerPassword").value;

        const password2 =
            document.getElementById("registerPassword2").value;

        if (!username || !password) {
            alert("Bé chưa nhập đủ thông tin nè! 🌙");
            return;
        }

        if (password !== password2) {
            alert("Hai mật khẩu chưa giống nhau!");
            return;
        }

        const users = getUsers();

        if (users[username]) {
            alert("Tên đăng nhập này đã tồn tại rồi!");
            return;
        }

        users[username] = {
            password: password,
            coins: 100,
            diamonds: 10
        };

        saveUsers(users);

        alert("Tạo tài khoản thành công! ✨");

        document.getElementById("registerUsername").value = "";
        document.getElementById("registerPassword").value = "";
        document.getElementById("registerPassword2").value = "";

        showForm("login");
    }


    function login() {

        const username =
            document.getElementById("loginUsername").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        const users = getUsers();

        if (!users[username]) {
            alert("Không tìm thấy tài khoản này!");
            return;
        }

        if (users[username].password !== password) {
            alert("Mật khẩu không đúng!");
            return;
        }

        localStorage.setItem("lunariaCurrentUser", username);

        document.getElementById("playerName").textContent = username;
        document.getElementById("coins").textContent = users[username].coins;
        document.getElementById("diamonds").textContent = users[username].diamonds;

        hideAll();
        document.getElementById("world").style.display = "block";
    }


    function logout() {

        localStorage.removeItem("lunariaCurrentUser");

        document.getElementById("loginUsername").value = "";
        document.getElementById("loginPassword").value = "";

        showHome();
    }

</script>

</body>
</html>
